<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SDSD 后台登录</title><style>body{font-family:Arial,"Microsoft YaHei";background:#f5f5f5;padding:40px}.box{max-width:420px;margin:60px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 12px #ddd}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px}.password-wrap{position:relative;display:flex;align-items:center;margin:8px 0 16px}.password-wrap input{width:100%;box-sizing:border-box;margin:0;padding-right:48px}.password-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px!important;height:40px;padding:0!important;margin:0!important;background:transparent!important;color:#555!important;font-size:20px;line-height:40px}.password-eye:active{background:#eee!important}button{padding:12px 24px;background:#222;color:#fff;border:0;border-radius:6px;cursor:pointer;width:100%}.msg{color:#c00;margin-top:12px}</style></head><body><div class="box"><h1>SDSD 后台登录</h1><label>管理员账号</label><input id="username" autocomplete="username"><label>管理员密码</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password"><button type="button" class="password-eye" aria-label="按住显示密码">👁</button></div><button onclick="login()">登录后台</button><p id="msg" class="msg"></p></div><script>(function(){const eye=document.querySelector('.password-eye'),input=document.getElementById('password');const show=()=>input.type='text',hide=()=>input.type='password';eye.addEventListener('mousedown',e=>{e.preventDefault();show()});eye.addEventListener('mouseup',hide);eye.addEventListener('mouseleave',hide);eye.addEventListener('touchstart',e=>{e.preventDefault();show()},{passive:false});eye.addEventListener('touchend',hide);eye.addEventListener('touchcancel',hide);eye.addEventListener('contextmenu',e=>e.preventDefault())})();function login(){fetch('/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:username.value,password:password.value})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message||'登录失败');location.replace('/admin.html?ticket=' + encodeURIComponent(d.ticket))}).catch(e=>msg.textContent=e.message)}</script></body></html>
