<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDSD Store</title>


<style>

body{

font-family:Arial,Helvetica,sans-serif;

margin:0;

background:#f5f5f5;

}


header{

background:#111;

color:white;

padding:40px;

text-align:center;

}



header h1{

font-size:42px;

margin-bottom:10px;

}



header p{

font-size:20px;

}



button{

background:white;

color:#111;

border:none;

padding:14px 35px;

border-radius:6px;

cursor:pointer;

font-size:16px;

}



.container{

max-width:1100px;

margin:auto;

padding:30px;

}



.products{

display:flex;

flex-wrap:wrap;

gap:25px;

}



.card{

background:white;

width:240px;

padding:15px;

border-radius:10px;

cursor:pointer;

box-shadow:0 2px 10px #ddd;

transition:.2s;

}



.card:hover{

transform:translateY(-5px);

}



.card img{

width:100%;

height:200px;

object-fit:cover;

border-radius:8px;

}



.price{

color:#e60000;

font-size:22px;

font-weight:bold;

}



.nav{

margin-top:25px;

}



.nav a{

color:white;

margin:15px;

text-decoration:none;

}



</style>

</head>



<body>



<header>


<h1>

SDSD Store

</h1>


<p>

Discover Quality Products

</p>



<div class="nav">


<a href="/">Home</a>


<a href="products.html">

Products

</a>


</div>


<br>


<button onclick="openProducts()">

View All Products

</button>


</header>







<div class="container">


<h2>

Featured Products

</h2>



<div id="products" class="products">

Loading products...

</div>


</div>







<script>



// Load products from backend


fetch("/products")


.then(response=>response.json())


.then(products=>{


let html="";



products.slice(0,4)
.forEach(product=>{


html += `


<div class="card"

onclick="openProduct(${product.id})">


<img src="/${product.image}">



<h3>

${product.name}

</h3>



<p>

${product.description}

</p>



<div class="price">

$${product.price}

</div>



</div>



`;



});



if(html===""){


html="<h3>No products available</h3>";



}



document.getElementById(
"products"
).innerHTML=html;



});








// Open product detail


function openProduct(id){


window.location.href=

"product-detail.html?id="+id;


}






// Open products page


function openProducts(){


window.location.href=

"products.html";


}



</script>




</body>

</html>
