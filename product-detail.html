<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details - SDSD Store</title>


<style>


body{

font-family:Arial,Helvetica,sans-serif;

background:#f5f5f5;

padding:40px;

}



.container{

max-width:800px;

margin:auto;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 2px 10px #ddd;

}



.product-image{

width:100%;

max-width:500px;

height:450px;

object-fit:cover;

border-radius:10px;

}



h1{

font-size:32px;

}



.description{

font-size:18px;

color:#555;

line-height:1.6;

}



.price{

font-size:30px;

color:#e60000;

font-weight:bold;

margin:20px 0;

}



button{

background:#111;

color:white;

border:none;

padding:15px 40px;

font-size:18px;

border-radius:6px;

cursor:pointer;

}



button:hover{

background:#333;

}



.back{

display:block;

margin-top:20px;

color:#555;

text-decoration:none;

}



</style>


</head>



<body>



<div class="container" id="product">


Loading product...


</div>






<script>


// Get product ID from URL

let productId =

new URLSearchParams(window.location.search)

.get("id");





fetch("/products")


.then(response=>response.json())


.then(products=>{


let item = products.find(

product => product.id == productId

);



if(!item){


document.getElementById("product").innerHTML=

"<h2>Product not found</h2>";

return;


}





document.getElementById("product").innerHTML = `


<img 

class="product-image"

src="${item.image.startsWith('http') ? item.image : '/' + item.image}"

alt="${item.name}">



<h1>

${item.name}

</h1>



<p class="description">

${item.description}

</p>



<div class="price">

$${item.price}

</div>



<button onclick="buyNow(${item.id})">

Buy Now

</button>



<a class="back" href="products.html">

← Back to Products

</a>


`;



});







function buyNow(id){


window.location.href=

"checkout.html?id="+id;



}



</script>



</body>

</html>
