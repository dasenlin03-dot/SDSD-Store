<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>SDSD商城后台管理</title>


<style>

body{

font-family:"Microsoft YaHei",Arial;

background:#f5f5f5;

padding:40px;

}


h1{

text-align:center;

}


.box{

background:white;

max-width:750px;

margin:25px auto;

padding:25px;

border-radius:10px;

border:1px solid #ddd;

}



input,textarea{

width:95%;

padding:12px;

margin:8px 0;

}



button{

padding:12px 25px;

margin-top:10px;

cursor:pointer;

background:#222;

color:white;

border:none;

border-radius:5px;

}



.product{

border-bottom:1px solid #ddd;

padding:15px;

}



.product img{

width:120px;

height:120px;

object-fit:cover;

}


.delete{

background:#c00;

}


.msg{

color:green;

font-weight:bold;

}



.admin-settings {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 300px;
  z-index: 1000;
}
.admin-settings h2 { margin-top: 0; }
.admin-settings input { width: 100%; box-sizing: border-box; }
@media (max-width: 700px) {
  .admin-settings { position: static; width: auto; margin-bottom: 20px; }
}
</style>

</head>


<body>


<h1>SDSD 商城后台管理系统</h1>



<!-- 支付设置 -->

<div class="box">


<h2>💳 支付设置</h2>


<label>PayPal 收款链接</label>

<input id="paypal">



<label>Cash App 收款链接</label>

<input id="cashapp">



<label>Stripe 支付链接</label>

<input id="stripe">



<label>银行信息</label>

<textarea id="bank"></textarea>



<button onclick="savePayment()">

保存支付设置

</button>


<p id="paymentMsg" class="msg"></p>


</div>






<!-- 商品上传 -->


<div class="box">


<h2>📦 添加商品</h2>



<label>商品名称</label>

<input id="productName">



<label>商品价格</label>

<input id="productPrice">



<label>商品描述</label>

<textarea id="productDescription"></textarea>



<label>选择商品图片</label>

<input 
type="file"
id="imageFile"
accept="image/*">



<button onclick="uploadImage()">

上传图片

</button>


<p id="imageMsg" class="msg"></p>



<input id="imagePath" readonly>



<button onclick="addProduct()">

添加商品

</button>


<p id="productMsg" class="msg"></p>


</div>
<!-- 管理员设置（右上角） -->
<div class="box admin-settings">
<h2>🔐 管理员设置</h2>
<label>原密码</label><input id="oldPassword" type="password" autocomplete="current-password">
<label>新密码（至少 8 位）</label><input id="newPassword" type="password" autocomplete="new-password">
<button onclick="changePassword()">修改密码</button>
<button onclick="logout()" style="margin-left:10px;background:#666">退出登录</button>
<p id="authMsg" class="msg"></p>
</div>

<!-- 商品管理 -->

<div class="box">


<h2>🗑 商品管理</h2>


<div id="productList">

正在加载商品...

</div>


</div>







<script>
function getImageUrl(image) {
  if (!image) return "";
  const value = String(image).trim();
  if (/^https?:\/\//i.test(value) || value.startsWith("//") || value.startsWith("data:") || value.startsWith("blob:")) return value;
  return value.startsWith("/") ? value : "/" + value;
}




// ======================
// 读取支付设置
// ======================


fetch("/payment-settings")

.then(res=>res.json())

.then(data=>{


document.getElementById("paypal").value =
data.paypal || "";


document.getElementById("cashapp").value =
data.cashapp || "";


document.getElementById("stripe").value =
data.stripe || "";


document.getElementById("bank").value =
data.bank || "";


});







// ======================
// 保存支付设置
// ======================


function savePayment(){


let data={


paypal:
document.getElementById("paypal").value,


cashapp:
document.getElementById("cashapp").value,


stripe:
document.getElementById("stripe").value,


bank:
document.getElementById("bank").value


};



fetch("/payment-settings",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify(data)


})


.then(res=>res.json())


.then(()=>{


document.getElementById("paymentMsg").innerHTML =
"支付设置保存成功 ✅";


});


}









// ======================
// 上传图片
// ======================


function uploadImage(){


let file =
document.getElementById("imageFile").files[0];



if(!file){


alert("请选择图片");


return;


}



let formData =
new FormData();


formData.append(
"image",
file
);



fetch("/upload-image",{
    method:"POST",
    body:formData
})
.then(async res => {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || "图片上传失败");
    return data;
})
.then(data=>{
    // 兼容不同版本服务器返回格式，优先使用 image
    const imagePath = data.image || data.path || data.url || (data.filename ? "images/" + data.filename : "");
    if (!imagePath || imagePath === "undefined") {
        throw new Error("服务器没有返回图片地址");
    }
    document.getElementById("imagePath").value = imagePath;
    document.getElementById("imageMsg").innerHTML = "图片上传成功 ✅";
})
.catch(err=>{
    document.getElementById("imagePath").value = "";
    document.getElementById("imageMsg").innerHTML = "图片上传失败：" + err.message;
});


}









// ======================
// 添加商品
// ======================


function addProduct(){
    const product = {
        name: document.getElementById("productName").value.trim(),
        price: document.getElementById("productPrice").value.trim(),
        description: document.getElementById("productDescription").value,
        image: document.getElementById("imagePath").value.trim()
    };

    if (!product.name) {
        alert("请输入商品名称");
        return;
    }

    fetch("/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product)
    })
    .then(async res => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || "商品添加失败");
        return data;
    })
    .then(() => {
        alert("商品添加成功！");
        // 点击 OK 后重新加载后台页面，恢复最初的空白添加商品状态。
        window.location.reload();
    })
    .catch(err => {
        alert("商品添加失败：" + err.message);
    });
}



// ======================
// 加载商品列表
// ======================
function loadProducts(){
    fetch("/products")
        .then(async res => {
            const data = await res.json().catch(() => []);
            if (!res.ok) throw new Error(data.message || "商品加载失败");
            return data;
        })
        .then(products => {
            let html = "";
            if (!products || products.length === 0) {
                html = "暂无商品";
            } else {
                products.forEach(product => {
                    html += `
<div class="product">
<img src="${getImageUrl(product.image)}">
<h3>${product.name}</h3>
<p>价格：$${product.price}</p>
<p>${product.description}</p>
<button class="delete" onclick="deleteProduct(${product.id})">删除商品</button>
</div>`;
                });
            }
            document.getElementById("productList").innerHTML = html;
        })
        .catch(err => {
            document.getElementById("productList").innerHTML = "商品加载失败：" + err.message;
        });
}

function deleteProduct(id){



if(!confirm("确定删除这个商品吗？")){


return;


}




fetch("/products/"+id,{


method:"DELETE"


})


.then(res=>res.json())


.then(()=>{


alert("商品删除成功");


loadProducts();



});


}





function changePassword(){
fetch("/admin-change-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({oldPassword:document.getElementById("oldPassword").value,newPassword:document.getElementById("newPassword").value})}).then(async r=>{let d=await r.json();if(!r.ok)throw new Error(d.message||"修改失败");document.getElementById("authMsg").textContent="密码修改成功，请重新登录";setTimeout(()=>location.href="/admin-login.html",800)}).catch(e=>document.getElementById("authMsg").textContent=e.message);
}
async function checkAdminSession(){
  try{
    const nav = performance.getEntriesByType("navigation")[0];
    // 刷新或浏览器前进/后退都重新登录，避免使用缓存页面绕过登录。
    if (nav && (nav.type === "reload" || nav.type === "back_forward")) {
      await fetch("/admin-logout",{method:"POST",credentials:"same-origin",cache:"no-store"});
      location.replace("/admin-login.html");
      return;
    }
    const r=await fetch("/admin-status",{cache:"no-store",credentials:"same-origin"});
    if(!r.ok) location.replace("/admin-login.html");
  }catch(e){ location.replace("/admin-login.html"); }
}

function logout(){
  fetch("/admin-logout",{method:"POST",credentials:"same-origin",cache:"no-store"})
    .finally(()=>location.replace("/admin-login.html"));
}

// 防止浏览器前进/后退缓存（BFCache）绕过登录页面
window.addEventListener("pageshow", checkAdminSession);

// 页面打开自动加载商品

loadProducts();



</script>



</body>


</html>
