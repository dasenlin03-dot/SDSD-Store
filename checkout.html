<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - SDSD Store</title>


<style>


body{

font-family:Arial,Helvetica,sans-serif;

background:#f5f5f5;

padding:40px;

}



.container{

max-width:750px;

margin:auto;

background:white;

padding:35px;

border-radius:12px;

box-shadow:0 2px 10px #ddd;

}



h1{

text-align:center;

}



.product{

border-bottom:1px solid #ddd;

padding-bottom:20px;

}



.price{

font-size:28px;

color:#e60000;

font-weight:bold;

}



.payment{

background:#f2f2f2;

padding:20px;

margin-top:20px;

border-radius:8px;

}



.payment h3{

margin-top:0;

}



a{

color:#0066cc;

word-break:break-all;

}



pre{

white-space:pre-wrap;

font-family:Arial;

}



.back{

display:block;

margin-top:25px;

}



</style>


</head>



<body>



<div class="container" id="checkout">

Loading checkout...

</div>







<script>



let productId =

new URLSearchParams(window.location.search)

.get("id");





let currentProduct;





// Load product


fetch("/products")


.then(response=>response.json())


.then(products=>{


currentProduct = products.find(

product=>product.id == productId

);



if(!currentProduct){


document.getElementById("checkout").innerHTML=

"<h2>Product not found</h2>";


return;


}





document.getElementById("checkout").innerHTML = `


<h1>

Checkout

</h1>


<div class="product">


<h2>

${currentProduct.name}

</h2>



<p>

${currentProduct.description}

</p>



<div class="price">

$${currentProduct.price}

</div>



</div>



<h2>

Choose Payment Method

</h2>



<div class="payment">


<h3>

PayPal

</h3>


<a id="paypal">

Loading...

</a>


</div>




<div class="payment">


<h3>

Cash App

</h3>


<a id="cashapp">

Loading...

</a>


</div>





<div class="payment">


<h3>

Stripe

</h3>


<a id="stripe">

Loading...

</a>


</div>





<div class="payment">


<h3>

Bank Transfer

</h3>


<pre id="bank">

Loading...

</pre>


</div>





<a class="back" href="products.html">

← Continue Shopping

</a>



`;





});








// Load payment settings


fetch("/payment-settings")


.then(response=>response.json())


.then(payment=>{



setTimeout(()=>{



document.getElementById("paypal").innerHTML =

payment.paypal || "Not available";


document.getElementById("paypal").href =

payment.paypal;



document.getElementById("cashapp").innerHTML =

payment.cashapp || "Not available";


document.getElementById("cashapp").href =

payment.cashapp;



document.getElementById("stripe").innerHTML =

payment.stripe || "Not available";


document.getElementById("stripe").href =

payment.stripe;



document.getElementById("bank").innerHTML =

payment.bank || "Not available";



},500);



});



</script>



</body>

</html>
