<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDSD Products</title>


<style>


body{

font-family:Arial,Helvetica,sans-serif;

background:#f5f5f5;

padding:30px;

}



h1{

text-align:center;

color:#222;

}



.products{

display:flex;

flex-wrap:wrap;

gap:25px;

max-width:1100px;

margin:auto;

}



.card{

background:white;

width:260px;

padding:15px;

border-radius:10px;

cursor:pointer;

box-shadow:0 2px 8px #ddd;

transition:.2s;

}



.card:hover{

transform:translateY(-5px);

}



.card img{

width:100%;

height:220px;

object-fit:cover;

border-radius:8px;

}



.price{

color:#e60000;

font-size:24px;

font-weight:bold;

}



.description{

color:#555;

}



</style>


</head>



<body>



<h1>

SDSD Products

</h1>



<div id="products" class="products">

Loading products...

</div>






<script>



fetch("/products")


.then(response=>response.json())


.then(products=>{


let html="";



products.forEach(product=>{


html += `


<div class="card"

onclick="openProduct(${product.id})">



<img src="${product.image && product.image.startsWith("http") ? product.image : "/" + product.image}"><img src="${product.image && product.image.startsWith("http") ? product.image : "/" + product.image}">


<h2>

${product.name}

</h2>



<p class="description">

${product.description}

</p>



<p class="price">

$${product.price}

</p>



</div>



`;



});



if(html===""){


html="<h2>No products available</h2>";



}



document.getElementById(
"products"
).innerHTML=html;



});







function openProduct(id){


window.location.href=

"product-detail.html?id="+id;



}



</script>




</body>

</html>
