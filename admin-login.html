<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SDSD 后台登录</title><style>body{font-family:Arial,"Microsoft YaHei";background:#f5f5f5;padding:40px}.box{max-width:420px;margin:60px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 12px #ddd}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px}button{padding:12px 24px;background:#222;color:#fff;border:0;border-radius:6px;cursor:pointer;width:100%}.msg{color:#c00;margin-top:12px}</style></head><body><div class="box"><h1>SDSD 后台登录</h1><label>管理员账号</label><input id="username" autocomplete="username"><label>管理员密码</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">登录后台</button><p id="msg" class="msg"></p></div><script>function login(){fetch('/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:username.value,password:password.value})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message||'登录失败');location.href='/admin.html'}).catch(e=>msg.textContent=e.message)}async function checkExistingSession(){
  try{
    const r=await fetch('/admin-status',{cache:'no-store',credentials:'same-origin'});
    if(r.ok) location.replace('/admin.html');
  }catch(e){}
}
window.addEventListener('pageshow',checkExistingSession);
checkExistingSession();</script></body></html>
